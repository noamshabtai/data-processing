base:
  simulation:
    seq_len: 10
    num_samples: 16
  model:
    epochs: 3
    learning_rate: 0.001
    batch_size: 4
    data_shuffle: true
    network:
      input_dim: 6
      hidden_dim: 32
      output_dim: 1

cases:
  - name: num_layers_1
    model:
      network:
        num_layers: 1
  - name: num_layers_2
    model:
      network:
        num_layers: 2
