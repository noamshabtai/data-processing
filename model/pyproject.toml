[project]
name = "model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]

[tool.uv.sources]
parametrize-tests = { path = "../../signal-processing/parametrize-tests", editable = true }

[dependency-groups]
dev = [
    "parametrize-tests",
    "pytest>=9.0.2",
]
