[project]
name = "stock-analyzer-activator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "activator",
    "data-fetcher",
    "stock-analyzer",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer_activator"]

[tool.uv.sources]
activator = { path = "../../../signal-processing/activator", editable = true }
data-fetcher = { path = "../../data-fetcher", editable = true }
stock-analyzer = { path = "..", editable = true }
parametrize-tests = { path = "../../../signal-processing/parametrize-tests", editable = true }

[dependency-groups]
dev = [
    "parametrize-tests",
    "pytest>=9.0.2",
    "pytest-mock",
]
