[project]
name = "stock-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "feature-extraction",
    "model",
    "system",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]

[tool.uv.sources]
feature-extraction = { path = "../feature-extraction", editable = true }
model = { path = "../model", editable = true }
system = { path = "../../signal-processing/system", editable = true }
parametrize-tests = { path = "../../signal-processing/parametrize-tests", editable = true }

[dependency-groups]
dev = [
    "parametrize-tests",
    "pytest>=9.0.2",
]
